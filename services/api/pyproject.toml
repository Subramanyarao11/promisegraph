[project]
name = "promisegraph-api"
version = "0.1.0"
description = "PromiseGraph API/domain service (Agent A)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "falkordb==1.8.0",
    "jsonschema==4.25.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promisegraph_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
