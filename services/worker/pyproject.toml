[project]
name = "promisegraph-worker"
version = "1.0.0"
description = "PromiseGraph private outbound worker (Agent B): job leases, bounded tool loop, scripted/model planners, local and Linear connectors. No inbound port."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "jsonschema==4.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promisegraph_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running API or protocol mock (PG_IT_BASE_URL)",
]
