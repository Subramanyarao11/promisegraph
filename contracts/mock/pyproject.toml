[project]
name = "promisegraph-mock-api"
version = "1.0.0"
description = "Protocol-faithful in-memory HTTP mock of the PromiseGraph API (contract 1.0.0). Development/test only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "jsonschema==4.25.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
